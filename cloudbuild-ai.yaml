steps:
  - name: 'gcr.io/kaniko-project/executor:latest'
    args:
      - --destination=gcr.io/studio-9105849211-9ba48/ai-service:latest
      - --cache=true
      - --cache-ttl=168h
      - --dockerfile=packages/services/ai-service/Dockerfile
      - --build-arg=CACHE_BUSTER=$BUILD_ID

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'ai-service'
      - '--image=gcr.io/studio-9105849211-9ba48/ai-service:latest'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--memory=1Gi'
      - '--cpu=1'
      - '--min-instances=0'
      - '--timeout=300'

options:
  machineType: E2_HIGHCPU_32

  logging: CLOUD_LOGGING_ONLY


