steps:
  # 1. Build and Deploy Authentication Service
  - name: 'gcr.io/kaniko-project/executor:latest'
    args:
      - --destination=gcr.io/studio-9105849211-9ba48/authentication-service:latest
      - --cache=true
      - --cache-ttl=168h
      - --dockerfile=packages/services/authentication-service/Dockerfile
      - --build-arg=CACHE_BUSTER=$BUILD_ID

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'authentication-service'
      - '--image=gcr.io/studio-9105849211-9ba48/authentication-service:latest'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--memory=512Mi'
      - '--cpu=1'
      - '--min-instances=0'
      - '--timeout=300'

  # 2. Build and Deploy Economic Engine
  - name: 'gcr.io/kaniko-project/executor:latest'
    args:
      - --destination=gcr.io/studio-9105849211-9ba48/economic-engine:latest
      - --cache=true
      - --cache-ttl=168h
      - --dockerfile=packages/services/economic-engine/Dockerfile

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'economic-engine'
      - '--image=gcr.io/studio-9105849211-9ba48/economic-engine:latest'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--memory=2Gi'
      - '--cpu=1'
      - '--min-instances=0'
      - '--timeout=600'

  # 3. Build and Deploy Frontend
  - name: 'gcr.io/kaniko-project/executor:latest'
    args:
      - --destination=gcr.io/studio-9105849211-9ba48/promethea-frontend:latest
      - --cache=true
      - --cache-ttl=168h
      - --dockerfile=packages/app/Dockerfile
      - --build-arg=NEXT_PUBLIC_AI_SERVICE_URL=https://ai-service-385120524005.us-central1.run.app
      - --build-arg=NEXT_PUBLIC_GUARDIAN_URL=https://authentication-service-385120524005.us-central1.run.app
      - --build-arg=NEXT_PUBLIC_ENGINE_URL=https://economic-engine-385120524005.us-central1.run.app
      - --build-arg=NEXT_PUBLIC_GOOGLE_MAPS_API_KEY=AIzaSyC06Ezpef-AKBBuLeThqWmP687vStwS2mE
      - --build-arg=NEXT_PUBLIC_DISABLE_FIREBASE=true
      - --build-arg=CACHE_BUSTER=$BUILD_ID

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'promethea-frontend'
      - '--image=gcr.io/studio-9105849211-9ba48/promethea-frontend:latest'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--memory=1Gi'
      - '--cpu=1'
      - '--min-instances=0'
      - '--timeout=300'

  # 4. Purge Cloudflare cache automatically after frontend rollout
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'node'
    args:
      - 'scripts/purge-cache.js'
    secretEnv: ['CLOUDFLARE_API_KEY']
    env:
      - 'CLOUDFLARE_ZONE_ID=dfcd262799ad2839371eafbf1df230b5'
      - 'CLOUDFLARE_EMAIL=lvllc@lvhllc.org'

options:
  machineType: 'E2_HIGHCPU_8'
  diskSizeGb: 100
  logging: CLOUD_LOGGING_ONLY
timeout: '1800s'

availableSecrets:
  secretManager:
    - versionName: projects/studio-9105849211-9ba48/secrets/CLOUDFLARE_GLOBAL_API_KEY/versions/latest
      env: 'CLOUDFLARE_API_KEY'

