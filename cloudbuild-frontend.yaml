steps:
  - name: 'gcr.io/kaniko-project/executor:latest'
    args:
      - --destination=gcr.io/studio-9105849211-9ba48/promethea-frontend:latest
      - --cache=true
      - --cache-ttl=168h
      - --dockerfile=packages/app/Dockerfile
      - --build-arg=NEXT_PUBLIC_AI_SERVICE_URL=${_AI_URL}
      - --build-arg=NEXT_PUBLIC_GUARDIAN_URL=${_GUARDIAN_URL}
      - --build-arg=NEXT_PUBLIC_ENGINE_URL=${_ENGINE_URL}
      - --build-arg=NEXT_PUBLIC_DISABLE_FIREBASE=${_DISABLE_FIREBASE}
options:
  machineType: 'E2_HIGHCPU_8'
  diskSizeGb: 100
timeout: '1200s'
substitutions:
  _AI_URL: 'https://ai-service-385120524005.us-central1.run.app'
  _GUARDIAN_URL: 'https://authentication-service-385120524005.us-central1.run.app'
  _ENGINE_URL: 'https://economic-engine-385120524005.us-central1.run.app'
  _DISABLE_FIREBASE: 'true'
