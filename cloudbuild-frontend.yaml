steps:
  # 1. Restore node_modules and Next.js compiler cache from GCS to skip clean installs/builds
  - name: 'gcr.io/cloud-builders/gsutil'
    id: 'restore-cache'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "========================================="
        echo "RESTORE CACHE PHASE"
        echo "========================================="
        gsutil cp gs://studio-9105849211-9ba48-build-cache/node-modules.tar.gz /tmp/node-modules.tar.gz || true
        gsutil cp gs://studio-9105849211-9ba48-build-cache/next-cache.tar.gz /tmp/next-cache.tar.gz || true
        
        if [ -f /tmp/node-modules.tar.gz ]; then
          echo "Extracting node_modules cache..."
          tar -xzf /tmp/node-modules.tar.gz -C .
        else
          echo "No node_modules cache found."
        fi
        
        if [ -f /tmp/next-cache.tar.gz ]; then
          echo "Extracting Next.js compiler cache..."
          tar -xzf /tmp/next-cache.tar.gz -C .
        else
          echo "No Next.js cache found."
        fi
        echo "Cache restoration process completed."

  # 2. Install workspace dependencies and compile TS & Next.js on the high-CPU host
  - name: 'node:20'
    id: 'install-and-build'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "========================================="
        echo "BUILD PHASE ON HIGH-CPU HOST"
        echo "========================================="
        echo "Cache buster token: ${_CACHE_BUSTER}"
        echo "Running npm install..."
        npm install --legacy-peer-deps
        
        echo "Cleaning stale build outputs..."
        if [ "${_CACHE_BUSTER}" != "none" ]; then
          echo "💥 Cache buster active (${_CACHE_BUSTER}). Busting Next.js build-cache..."
          rm -rf packages/app/.next
        else
          echo "♻️ Next.js cache buster not active. Preserving compiler cache..."
          if [ -d "packages/app/.next" ]; then
            find packages/app/.next -mindepth 1 -maxdepth 1 ! -name 'cache' -exec rm -rf {} + 2>/dev/null || true
          fi
        fi
        rm -rf packages/*/dist packages/*/tsconfig.tsbuildinfo packages/services/*/dist packages/services/*/tsconfig.tsbuildinfo
        
        echo "Compiling TS workspaces in structural dependency order..."
        npx tsc --build packages/lib/tsconfig.json
        npx tsc --build packages/sovereign-store/tsconfig.json
        npx tsc --build packages/hooks/tsconfig.json
        npx tsc --build packages/ui/tsconfig.json
        npx tsc --build packages/ai/tsconfig.json
        npx tsc --build packages/components/tsconfig.json
        
        echo "Injecting build env and building Next.js application..."
        export NEXT_PUBLIC_AI_SERVICE_URL=${_AI_URL}
        export NEXT_PUBLIC_GUARDIAN_URL=${_GUARDIAN_URL}
        export NEXT_PUBLIC_ENGINE_URL=${_ENGINE_URL}
        export NEXT_PUBLIC_LEDGER_URL=${_LEDGER_URL}
        export NEXT_PUBLIC_GOOGLE_MAPS_API_KEY=${_MAPS_KEY}
        export NEXT_PUBLIC_GOOGLE_MAPS_MAP_ID=${_MAPS_ID}
        export NEXT_PUBLIC_DISABLE_FIREBASE=${_DISABLE_FIREBASE}
        export NEXT_PUBLIC_DYNAMIC_ENVIRONMENT_ID=${_DYNAMIC_ENV_ID}
        export NEXT_PUBLIC_FIREBASE_PROJECT_ID=studio-9105849211-9ba48
        export NODE_ENV=production
        export NEXT_TELEMETRY_DISABLED=1
        
        npm run build --workspace=@promethea/app

  # 3. Archive and upload current caches back to GCS for the next build run
  - name: 'gcr.io/cloud-builders/gsutil'
    id: 'save-cache'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "========================================="
        echo "SAVE CACHE PHASE"
        echo "========================================="
        echo "Packing node_modules..."
        tar -czf /tmp/node-modules.tar.gz node_modules packages/*/node_modules
        gsutil cp /tmp/node-modules.tar.gz gs://studio-9105849211-9ba48-build-cache/node-modules.tar.gz
        
        if [ -d "packages/app/.next/cache" ]; then
          echo "Packing Next.js compiler cache..."
          tar -czf /tmp/next-cache.tar.gz packages/app/.next/cache
          gsutil cp /tmp/next-cache.tar.gz gs://studio-9105849211-9ba48-build-cache/next-cache.tar.gz
        else
          echo "No Next.js compiler cache directory found to preserve."
        fi
        echo "Caches stored successfully."

  # 4. Pack the pre-compiled standalone Next.js server into docker and push to GCR
  - name: 'gcr.io/kaniko-project/executor:latest'
    id: 'pack-image'
    args:
      - --destination=gcr.io/studio-9105849211-9ba48/promethea-frontend:latest
      - --cache=true
      - --cache-ttl=168h
      - --cache-repo=gcr.io/studio-9105849211-9ba48/promethea-frontend/cache
      - --dockerfile=packages/app/Dockerfile
      - --build-arg=CACHE_BUSTER=${_CACHE_BUSTER}

  # 5. Deploy the freshly pushed container image to Google Cloud Run (Vanguard Canary)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-run'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'promethea-frontend'
      - '--image=gcr.io/studio-9105849211-9ba48/promethea-frontend:latest'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--memory=1Gi'
      - '--cpu=1'
      - '--min-instances=0'
      - '--timeout=300'

  # 6. Purge the Cloudflare edge cache to ensure immediate global routing propagation
  - name: 'node:20'
    id: 'purge-cloudflare'
    entrypoint: 'bash'
    args:
      - '-c'
      - 'node scripts/purge-cache.js'
    secretEnv: ['CLOUDFLARE_API_KEY']
    env:
      - 'CLOUDFLARE_ZONE_ID=dfcd262799ad2839371eafbf1df230b5'
      - 'CLOUDFLARE_EMAIL=lvllc@lvhllc.org'

options:
  machineType: E2_HIGHCPU_8
  diskSizeGb: 100
  logging: CLOUD_LOGGING_ONLY
timeout: '2400s'

availableSecrets:
  secretManager:
    - versionName: projects/studio-9105849211-9ba48/secrets/CLOUDFLARE_GLOBAL_API_KEY/versions/latest
      env: 'CLOUDFLARE_API_KEY'

substitutions:
  _AI_URL: 'https://ai-service-385120524005.us-central1.run.app'
  _GUARDIAN_URL: 'https://authentication-service-385120524005.us-central1.run.app'
  _ENGINE_URL: 'https://economic-engine-385120524005.us-central1.run.app'
  _LEDGER_URL: 'https://sovereign-ledger-385120524005.us-central1.run.app'
  _MAPS_KEY: ''
  _MAPS_ID: 'DEMO_MAP_ID'
  _DISABLE_FIREBASE: 'true'
  _DYNAMIC_ENV_ID: 'c4599934-a538-4829-b3d9-001b28d6faad'
  _CACHE_BUSTER: 'none'
