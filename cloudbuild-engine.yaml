steps:
  - name: 'gcr.io/kaniko-project/executor:latest'
    args:
      - --destination=gcr.io/studio-9105849211-9ba48/economic-engine:latest
      - --cache=true
      - --cache-ttl=168h
      - --dockerfile=packages/services/economic-engine/Dockerfile

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'economic-engine'
      - '--image=gcr.io/studio-9105849211-9ba48/economic-engine:latest'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--memory=2Gi'
      - '--cpu=1'
      - '--min-instances=0'
      - '--timeout=600'

options:
  machineType: E2_HIGHCPU_32

  logging: CLOUD_LOGGING_ONLY


