steps:
  - name: 'alpine'
    id: 'prune-workspaces'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        echo "Pruning non-essential workspaces to avoid installing frontend dependencies..."
        rm -rf packages/app packages/services/ai-service packages/services/economic-engine packages/services/sbi-core
  - name: 'gcr.io/kaniko-project/executor:latest'
    args:
      - --destination=gcr.io/studio-9105849211-9ba48/authentication-service:latest
      - --cache=true
      - --cache-ttl=168h
      - --dockerfile=packages/services/authentication-service/Dockerfile
      - --build-arg=CACHE_BUSTER=$BUILD_ID

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'authentication-service'
      - '--image=gcr.io/studio-9105849211-9ba48/authentication-service:latest'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--memory=512Mi'
      - '--cpu=1'
      - '--min-instances=0'
      - '--timeout=300'
timeout: '1200s'

options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY


